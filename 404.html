<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>404 - Page Not Found</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <style>
      html,
      body {
        margin: 0;
        padding: 0;
        background: #000000;
        color: white;
        font-family: 'Poppins', 'Inter', -apple-system, BlinkMacSystemFont,
          'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        overflow-x: hidden;
      }

      .section {
        width: 100vw;
        height: 100vh;
        background-color: #000000;
        position: relative;
        overflow: hidden;
        display: flex;
        justify-content: center;
        align-items: center;
      }

      .content {
        text-align: center;
        z-index: 10;
        position: relative;
        padding: 20px;
        max-width: 90%;
      }

      .content h1 {
        font-size: clamp(2rem, 8vw, 5rem);
        font-weight: 800;
        margin-bottom: 1rem;
        transition: transform 0.1s ease-out;
        mix-blend-mode: exclusion;
        letter-spacing: 0.05em;
      }

      .content h4 {
        font-size: clamp(1rem, 4vw, 2rem);
        font-weight: 700;
        transition: transform 0.1s ease-out;
        margin-bottom: 2rem;
      }

      .gradient-text {
        font-weight: bold;
        background: linear-gradient(to right, #f73d3d, #850000);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
      }

      .fly-button {
        margin-top: 2rem;
        position: relative;
        display: inline-block;
        border-radius: 9999px;
        overflow: hidden;
        cursor: pointer;
        text-decoration: none;
        padding: 4px;
        max-width: 100%;
      }

      .fly-button .outer {
        position: absolute;
        inset: -1000%;
        background: conic-gradient(
          from 90deg at 50% 50%,
          #f73d3d 0%,
          #850000 25%,
          #f73d3d 50%,
          #850000 75%,
          #f73d3d 100%
        );
        animation: spin 2s linear infinite;
        z-index: 0;
      }

      .fly-button .inner {
        position: relative;
        background: #0f0f0f;
        color: white;
        padding: clamp(0.8rem, 2vw, 1.2rem) clamp(1.5rem, 5vw, 2.5rem);
        border-radius: 9999px;
        font-size: clamp(1rem, 4vw, 1.5rem);
        font-weight: 600;
        backdrop-filter: blur(20px);
        z-index: 1;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        transition: all 0.3s ease;
        white-space: nowrap;
      }

      .fly-button:hover .inner {
        background-color: #1a1a1a;
        box-shadow: 0 0 12px #f73d3d77;
      }

      @keyframes spin {
        0% {
          transform: rotate(0);
        }
        100% {
          transform: rotate(360deg);
        }
      }
    </style>
  </head>

  <body>
    <section class="section">
      <div class="content">
        <h1 id="heading1">Looks like you took a wrong turn...</h1>
        <h4 id="heading2">
          <span class="gradient-text">
            OR MAYBE WE MOVED TO ANOTHER DIMENSION 
          </span>💫
        </h4>
        <a href="/" class="fly-button">
          <span class="outer"></span>
          <span class="inner">FLY Me Home 🛩️</span>
        </a>
      </div>
    </section>

    <script>
      window.addEventListener("scroll", () => {
        const scrollY = window.scrollY;
        document.getElementById("heading1").style.transform = `translateX(${scrollY * 2}px)`;
        document.getElementById("heading2").style.transform = `translateX(-${scrollY * 2}px)`;
      });
    </script>
  </body>
</html>
